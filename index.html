<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mini Class App Demo</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<!-- 1. Live greeting (input event + DOM) -->
	<div class="card">
		<h1 id="greeting">Hello, BOOTCAMPERS!</h1>
		<input id="nameInput" type="text" placeholder="Type your name">
	</div>

	<!-- 2. Click counter (let + operators + if) -->
	<div class="card">
		<button id="clickBtn">Clicks: 0</button>
		<p id="message">Click the button!</p>
	</div>

	<!-- 3. Task list (form submit + array + loop) -->
	<div class="card">
		<form id="taskForm">
			<input id="taskInput" type="text" placeholder="Add a task">
			<button type="submit">Add</button>
		</form>
		<ul id="taskList"></ul>
	</div>

	<script src="script.js"></script>
</body>

</html>
